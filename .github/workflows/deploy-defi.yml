name: Validate and deploy Defi ton pote
on:
  pull_request:
    paths: ['defi/**', '.github/workflows/deploy-defi.yml']
  push:
    branches: [main]
    paths: ['defi/**', '.github/workflows/deploy-defi.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: defi-${{ github.event_name == 'pull_request' && github.ref || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: defi
    env:
      PAGES_BASE_PATH: ${{ vars.PAGES_BASE_PATH || '/jeux/' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: defi/.nvmrc
          cache: npm
          cache-dependency-path: defi/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:run
      - run: npm run build
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: defi/dist
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy validated artifact
        id: deployment
        uses: actions/deploy-pages@v4
